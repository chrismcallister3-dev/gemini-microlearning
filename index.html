<!doctype html>
<!--
Gemini Microlearning — ISD Test Build v6
Standalone HTML prototype for independent instructional design review.
Content-reviewed revision based on v5.2. Functionality remains unchanged from the validated v5.1 baseline.
No backend, LMS connection, localStorage, or sessionStorage is used by this prototype.
Learner-entered content remains in page memory for the active browser session only.
-->

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Microlearning — Prototype v6 (Screens 1–24)</title>
<style>
:root{
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color:#1b1b1b;
  background:#f4f6f8;
  --ink:#1b1b1b;
  --muted:#565c65;
  --navy:#16365c;
  --navy-deep:#102f4f;
  --blue:#005ea8;
  --blue-dark:#1a4480;
  --blue-pale:#eef6fb;
  --surface:#ffffff;
  --surface-soft:#f8fafb;
  --border:#c9d1d9;
  --border-strong:#8d98a5;
  --focus:#ffbe2e;
  --warning-bg:#fff6d8;
  --warning-border:#8a7230;
  --success-bg:#eaf5ee;
  --success-border:#3a7d52;
  --radius:6px;
  --content-width:920px;
}
*{box-sizing:border-box}
html{background:#f4f6f8}
body{
  margin:0;
  min-height:100vh;
  background:
    linear-gradient(180deg,#eef3f7 0,#f4f6f8 170px,#f4f6f8 100%);
  color:var(--ink);
}
header{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--navy);
  color:#fff;
  border-bottom:4px solid #c9a227;
  padding:0;
  box-shadow:0 2px 8px rgba(16,47,79,.12);
}
header .wrap{
  padding:15px 24px 14px;
}
.wrap{
  width:min(var(--content-width),calc(100% - 36px));
  margin:0 auto;
}
.topline{
  display:flex;
  justify-content:space-between;
  gap:28px;
  align-items:center;
}
.brand{
  font-weight:700;
  font-size:1.08rem;
  letter-spacing:.01em;
}
.prototype{
  font-size:.82rem;
  line-height:1.35;
  margin-top:3px;
  color:#e7eef6;
}
.progress{
  flex:0 0 auto;
  font-size:.88rem;
  font-weight:700;
  color:#fff;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.30);
  border-radius:999px;
  padding:7px 11px;
  white-space:nowrap;
}
main{
  padding:38px 18px 72px;
}
.card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-top:5px solid var(--blue);
  border-radius:var(--radius);
  padding:34px 38px 32px;
  box-shadow:0 4px 16px rgba(31,53,72,.08);
}
.screenlabel{
  margin:0 0 8px;
  color:var(--blue-dark);
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.085em;
  text-transform:uppercase;
}
h1{
  max-width:760px;
  margin:0 0 20px;
  color:var(--navy-deep);
  font-size:clamp(1.75rem,3vw,2.2rem);
  line-height:1.18;
  letter-spacing:-.015em;
}
h2{
  max-width:760px;
  margin:28px 0 10px;
  color:var(--navy-deep);
  font-size:1.08rem;
  line-height:1.35;
}
p,li{
  max-width:74ch;
  font-size:1rem;
  line-height:1.62;
}
p{margin:0 0 16px}
ul,ol{
  margin-top:8px;
  margin-bottom:18px;
  padding-left:1.35rem;
}
li+li{margin-top:6px}
.lead{
  max-width:68ch;
  color:#243b53;
  font-size:1.13rem;
  line-height:1.58;
}
.muted{
  color:var(--muted);
  font-size:.95rem;
}
label{
  display:block;
  margin:22px 0 8px;
  color:var(--navy-deep);
}
.artifact{
  margin:14px 0 20px;
  padding:16px 18px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:var(--blue-pale);
  border:1px solid #c8dce9;
  border-left:5px solid var(--blue);
  border-radius:4px;
  color:#263746;
  line-height:1.55;
}
.example{
  margin:16px 0 20px;
  padding:16px 18px;
  background:var(--surface-soft);
  border:1px solid var(--border);
  border-radius:var(--radius);
}
.warning,
.success{
  max-width:78ch;
  margin:18px 0;
  padding:15px 17px;
  border-radius:4px;
  line-height:1.55;
}
.warning{
  background:var(--warning-bg);
  border:1px solid #e6d99a;
  border-left:5px solid var(--warning-border);
}
.success{
  background:var(--success-bg);
  border:1px solid #c4dfcd;
  border-left:5px solid var(--success-border);
}
textarea{
  display:block;
  width:100%;
  min-height:164px;
  margin:0;
  padding:13px 14px;
  resize:vertical;
  font:inherit;
  line-height:1.5;
  color:var(--ink);
  background:#fff;
  border:1px solid var(--border-strong);
  border-radius:4px;
  box-shadow:inset 0 1px 2px rgba(27,27,27,.04);
}
textarea:hover{
  border-color:#6f7b86;
}
textarea:focus,
button:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:3px;
}
button{
  min-height:44px;
  padding:10px 17px;
  cursor:pointer;
  font:inherit;
  font-weight:700;
  line-height:1.25;
  color:var(--blue-dark);
  background:#fff;
  border:2px solid var(--blue-dark);
  border-radius:4px;
  transition:background-color .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease;
}
button:hover{
  background:#eef3f7;
  border-color:var(--navy-deep);
  color:var(--navy-deep);
}
button:active{
  transform:translateY(1px);
}
button.primary{
  margin-left:auto;
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:0 1px 2px rgba(0,74,130,.12);
}
button.primary:hover{
  color:#fff;
  background:var(--blue-dark);
  border-color:var(--blue-dark);
}
button:disabled{
  cursor:not-allowed;
  color:#71767a;
  background:#e6e6e6;
  border-color:#c9c9c9;
  box-shadow:none;
}
.actions{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:30px;
  padding-top:22px;
  border-top:1px solid #e2e6ea;
}
.choice{
  display:block;
  width:100%;
  margin:9px 0;
  padding:13px 15px;
  text-align:left;
  background:#fff;
  border-width:1px 1px 1px 4px;
  border-color:var(--border) var(--border) var(--border) var(--blue);
}
.choice:hover{
  background:#f4f8fb;
  border-left-color:var(--blue-dark);
}
strong{font-weight:700}

@media (max-width:700px){
  header .wrap{padding:13px 16px 12px}
  .wrap{width:min(100% - 24px,var(--content-width))}
  .topline{
    align-items:flex-start;
    flex-direction:column;
    gap:10px;
  }
  .progress{padding:5px 9px}
  main{padding:24px 10px 52px}
  .card{
    padding:26px 22px 24px;
    box-shadow:0 2px 10px rgba(31,53,72,.07);
  }
  h1{font-size:1.72rem}
  .actions{
    align-items:stretch;
    flex-direction:column;
  }
  .actions button,
  button.primary{
    width:100%;
    margin-left:0;
  }
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}
@media print{
  header{position:static}
  body{background:#fff}
  main{padding:0}
  .card{border:0;box-shadow:none}
}
</style>
</head>
<body>
<header><div class="wrap topline"><div><div class="brand">Gemini Microlearning</div><div class="prototype">Prototype v6 — Screens 1–24</div></div><div id="progress" class="progress"></div></div></header>
<main><div class="wrap"><section id="app" class="card" aria-live="polite"></section></div></main>
<script>
"use strict";

const state={
 originalRequest:"",
 originalResponse:"",
 inferenceResponse:"",
 workingRequest:"",
 taskDecision:"",
 contextDecision:"",
 expectationDecision:"",
 informationNeeded:"",
 revisedResponse:"",
 purposefulRevision:"",
 iterativeResponse:"",
 currentUsableResponse:"",
 usabilityDecision:"",
 verificationDecision:"",
 completionMessage:""
};
let screen=1;
const app=document.getElementById("app");
const progress=document.getElementById("progress");
const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const getVal=id=>document.getElementById(id)?.value.trim()||"";
function next(n){screen=n;render();window.scrollTo(0,0);}
function openGemini(){window.open("https://gemini.google.com/","_blank","noopener,noreferrer");}
function shell(title,body){
 progress.textContent=`Screen ${screen} of 24`;
 app.innerHTML=`<div class="screenlabel">Screen ${screen} of 24</div><h1>${title}</h1>${body}`;
}
function artifact(label,value){return `<h2>${label}</h2><div class="artifact">${esc(value||"[Not entered yet]")}</div>`;}
function ensureWorking(){if(!state.workingRequest) state.workingRequest=state.originalRequest;}
function saveRequest(){
 const value=getVal("original");
 if(!value){alert("Enter your work request first.");return;}
 state.originalRequest=value;
 state.workingRequest=value;
 next(3);
}
function saveResponse(){
 const value=getVal("origresp");
 if(!value){alert("Enter or paste the relevant part of Gemini’s response first.");return;}
 state.originalResponse=value;
 next(4);
}
function saveInference(){
 const value=getVal("inference");
 if(!value){alert("Enter or paste the relevant part of Gemini’s response first.");return;}
 state.inferenceResponse=value;
 next(6);
}
function taskChoice(choice){
 ensureWorking(); state.taskDecision=choice;
 if(choice==="yes") next(9); else render();
}
function saveTaskRevision(){
 const value=getVal("workingTask");
 if(!value){alert("Enter your revised request first.");return;}
 state.workingRequest=value; next(9);
}
function contextChoice(choice){
 ensureWorking(); state.contextDecision=choice;
 if(choice==="yes") next(11); else render();
}
function saveContextRevision(){
 const value=getVal("workingContext");
 if(!value){alert("Enter your revised request first.");return;}
 state.workingRequest=value; next(11);
}
function expectationChoice(choice){
 ensureWorking(); state.expectationDecision=choice;
 if(choice==="yes") next(13); else render();
}
function saveExpectationRevision(){
 const value=getVal("workingExpectation");
 if(!value){alert("Enter your revised request first.");return;}
 state.workingRequest=value; next(13);
}
function saveInformationNeeded(){
 const value=getVal("informationNeeded");
 if(!value){alert("Identify the information Gemini would need for the task first.");return;}
 state.informationNeeded=value; next(16);
}
function saveRevisedResponse(){
 const value=getVal("revisedResponse");
 if(!value){alert("Enter or paste the relevant part of Gemini's revised response first.");return;}
 state.revisedResponse=value;
 state.usabilityDecision="";
 next(19);
}
function usabilityChoice(choice){
 state.usabilityDecision=choice;
 if(choice==="yes"){
   state.currentUsableResponse=state.revisedResponse;
   next(22);
 } else {
   next(20);
 }
}
function savePurposefulRevision(){
 const value=getVal("purposefulRevision");
 if(!value){alert("Enter the revision you want to make before continuing.");return;}
 state.purposefulRevision=value;
 state.iterativeResponse="";
 next(21);
}
function iterativeUsabilityChoice(choice){
 const value=getVal("iterativeResponse");
 if(!value){alert("Enter or paste the new Gemini response first.");return;}
 state.iterativeResponse=value;
 if(choice==="yes"){
   state.currentUsableResponse=value;
   next(22);
 } else {
   state.iterativeResponse="";
   next(20);
 }
}
function verificationChoice(choice){
 state.verificationDecision=choice;
 if(choice==="yes") next(24);
 else render();
}
function verificationFollowup(choice){
 if(choice==="verify"){
   state.verificationDecision="verify";
   render();
 } else if(choice==="revise"){
   state.verificationDecision="revise";
   state.iterativeResponse="";
   next(20);
 }
}
function finishActivity(){
 for(const key of Object.keys(state)){
   if(typeof state[key]==="string") state[key]="";
 }
 screen=24;
 state.completionMessage="Activity complete. Temporary session information has been cleared.";
 render();
}

function render(){
 ensureWorking();

 if(screen===1){
  shell("Set Up the Two-Tab Experience",`
   <p class="lead">In this activity, you will switch between this microlearning and Gemini in two browser tabs.</p>
   <p>Select the <strong>Open Gemini in a New Tab</strong> button below. Leave Gemini open throughout this microlearning. You will switch between this microlearning and Gemini as you work.</p>
   <div class="warning"><strong>Prototype privacy:</strong> Anything you enter here exists only in this browser page's memory. It is not saved to local storage, sent to an LMS, or transmitted anywhere by this prototype. Refreshing or closing the page will discard it.</div>
   <div class="actions"><button onclick="openGemini()">Open Gemini in a New Tab</button><button class="primary" onclick="next(2)">Continue</button></div>`);
 }
 else if(screen===2){
  shell("Provide Your Work Request",`
   <p>Think of a real work request Gemini could help you address. Enter it in the text field below exactly as you would normally ask it.</p>
   <label for="original"><strong>Your Original Request</strong></label>
   <textarea id="original">${esc(state.originalRequest)}</textarea>
   <p>Click and drag over all of the text in the field to highlight it. Use your normal copy method (ex.: Ctrl+C or right-click and select Copy) to copy your prompt.</p>
   <p>Switch to the Gemini tab. Paste your copied text into the Gemini text field and then submit the request. Review Gemini's response without revising it yet. Then switch back to this tab and then select Continue below.</p>
   <div class="actions"><button class="primary" onclick="saveRequest()">Continue</button></div>`);
 }
 else if(screen===3){
  shell("Capture the Relevant Part of Gemini’s Response",`
   ${artifact("Your Original Request",state.originalRequest)}
   <p>Review what Gemini produced and identify the information that represents the work you asked it to perform. Copy that information and paste it into the text field below.</p>
   <div class="example"><strong>Examples:</strong>
    <ul>
     <li>If Gemini drafted an email, copy the <strong>email body</strong>. You may also include the subject line.</li>
     <li>If Gemini created a summary, copy the <strong>summary</strong>.</li>
     <li>If Gemini produced an analysis or recommendations, copy the <strong>analysis or recommendations you would consider using</strong>.</li>
    </ul>
    <p>You do not need to copy interface controls or other information that is not part of the work you asked Gemini to produce.</p>
   </div>
   <label for="origresp"><strong>Gemini's Original Response</strong></label>
   <textarea id="origresp">${esc(state.originalResponse)}</textarea>
   <div class="actions"><button onclick="next(2)">Back</button><button class="primary" onclick="saveResponse()">Continue</button></div>`);
 }
 else if(screen===4){
  const diag="What information did you have to infer from my original prompt? What assumptions did you have to make to produce your response? What information in my prompt or our conversation led you to make those inferences or assumptions?";
  shell("Ask Gemini What It Had to Decide",`
   ${artifact("Your Original Request",state.originalRequest)}
   ${artifact("Gemini's Original Response",state.originalResponse)}
   <p>Now ask Gemini to explain what it had to assume or infer when it responded to your original request using the prompt shown below.</p>
   <div class="artifact">${esc(diag)}</div>
   <p>Click and drag over all of the text in the field to highlight it. Use your normal copy method (ex.: Ctrl+C or right-click and select Copy) to copy your prompt.</p>
   <p>Switch to the Gemini tab. Paste your copied text into the Gemini text field and then submit the request. Review Gemini's response without revising it yet. Then switch back to this tab and then select Continue below.</p>
   <div class="actions"><button onclick="next(3)">Back</button><button class="primary" onclick="next(5)">Continue</button></div>`);
 }
 else if(screen===5){
  shell("Examine What Happened",`
   ${artifact("Your Original Request",state.originalRequest)}
   ${artifact("Gemini's Original Response",state.originalResponse)}
   <p>Copy the relevant part of Gemini's explanation of the assumptions and inferences it made, and paste it into the text field below.</p>
   <label for="inference"><strong>Gemini's Assumptions and Inferences</strong></label>
   <textarea id="inference">${esc(state.inferenceResponse)}</textarea>
   <h2>As you review it, consider:</h2>
   <ul>
    <li>Did you realize how many decisions you were asking Gemini to make?</li>
    <li>Did Gemini misinterpret something you thought was clear?</li>
    <li>Were there assumptions made by Gemini that might have changed the response from what you anticipated?</li>
    <li>Which decisions were reasonable for Gemini to make—and which would you rather control?</li>
   </ul>
   <div class="actions"><button onclick="next(4)">Back</button><button class="primary" onclick="saveInference()">Continue</button></div>`);
 }
 else if(screen===6){
  shell("Make the Distinction",`
   ${artifact("Gemini's Assumptions and Inferences",state.inferenceResponse)}
   <p class="lead"><strong>What should you decide—and what are you comfortable allowing Gemini to decide?</strong></p>
   <p><strong>Effective use of AI begins with deliberately making that distinction.</strong></p>
   <div class="actions"><button onclick="next(5)">Back</button><button class="primary" onclick="next(7)">Next: Direct Gemini</button></div>`);
 }
 else if(screen===7){
  shell("Direct Gemini",`
   <p>Gemini's response was shaped by the direction you provided—and by what it had to infer when information was missing.</p>
   <p>You can provide more deliberate direction by considering three questions:</p>
   <ul>
    <li><strong>What do I want Gemini to do?</strong></li>
    <li><strong>What does Gemini need to know?</strong></li>
    <li><strong>What should a useful result look like?</strong></li>
   </ul>
   <p>These aren't a formula for creating a perfect prompt. They are a repeatable way to think about providing directions when working with Gemini.</p>
   <p>You'll use these three questions to examine and revise this request.</p>
   <div class="actions"><button onclick="next(6)">Back</button><button class="primary" onclick="next(8)">Continue</button></div>`);
 }
 else if(screen===8){
  const revise = state.taskDecision==="no";
  shell("What Do You Want Gemini to Do?",`
   ${artifact("Your Original Request",state.originalRequest)}
   <p><strong>Is it clear what you want Gemini to do?</strong></p>
   <p>A clear task identifies the action you want Gemini to perform and, when important, what you are trying to accomplish.</p>
   <div class="example"><strong>Example:</strong><br>“Project status” identifies a topic.<br>“Summarize these project notes into a status report” identifies a task.</div>
   <p>Now use your judgment. Does your request clearly identify what you want Gemini to do?</p>
   <button class="choice" onclick="taskChoice('yes')"><strong>Yes — My task is clear</strong></button>
   <button class="choice" onclick="taskChoice('no')"><strong>No — I want to revise it</strong></button>
   ${revise ? `
    <h2>Revise Your Working Request</h2>
    <p>Revise your request so the task more clearly communicates what you want Gemini to do.</p>
    <textarea id="workingTask">${esc(state.workingRequest)}</textarea>
    <p class="muted"><strong>Don't submit it to Gemini yet.</strong> You'll continue developing this request in the next few screens.</p>
    <div class="actions"><button class="primary" onclick="saveTaskRevision()">Save Revision and Continue</button></div>` : ``}
   <div class="actions"><button onclick="next(7)">Back</button></div>`);
 }
 else if(screen===9){
  shell("What Does Gemini Need to Know?",`
   <p>Context helps Gemini understand the task. Depending on the work, useful context might include who the work is for, why it is needed, relevant background, constraints, or other information that affects how the task should be completed.</p>
   <p>You don't need to provide everything you know. Provide context that matters to the task.</p>
   ${artifact("Your Working Request",state.workingRequest)}
   <p>Next, you'll decide whether Gemini has the context it needs to understand what you want.</p>
   <div class="actions"><button onclick="next(8)">Back</button><button class="primary" onclick="next(10)">Continue</button></div>`);
 }
 else if(screen===10){
  const revise = state.contextDecision==="no";
  shell("Evaluate and Revise Context",`
   ${artifact("Your Working Request",state.workingRequest)}
   ${artifact("Gemini's Earlier Assumptions and Inferences",state.inferenceResponse)}
   <p><strong>Does Gemini have the context it needs to understand what you want?</strong></p>
   <p>Look back at the assumptions and inferences Gemini identified earlier. What information or clarification would you rather provide to Gemini than have it decide on its own?</p>
   <div class="example"><strong>Example:</strong><br>
   “Summarize these project notes into a status report.”<br><br>
   could become:<br><br>
   “Summarize these project notes into a status report for project leadership. The report will be used during our weekly meeting to review progress, risks, and decisions that need leadership attention.”</div>
   <button class="choice" onclick="contextChoice('yes')"><strong>Yes — Gemini has the context it needs</strong></button>
   <button class="choice" onclick="contextChoice('no')"><strong>No — I want to add or clarify context</strong></button>
   ${revise ? `
    <h2>Revise Your Working Request</h2>
    <p>Add or clarify the missing context that would help Gemini better understand what you want.</p>
    <textarea id="workingContext">${esc(state.workingRequest)}</textarea>
    <p class="muted"><strong>Don't submit it to Gemini yet.</strong></p>
    <div class="actions"><button class="primary" onclick="saveContextRevision()">Save Revision and Continue</button></div>` : ``}
   <div class="actions"><button onclick="next(9)">Back</button></div>`);
 }
 else if(screen===11){
  shell("What Should a Useful Result Look Like?",`
   <p>Task and context help Gemini understand what you want. Expectations help communicate what makes the response useful, which might also include organization, level of detail, tone, length, or required information.</p>
   <p>You don't need to specify every characteristic of the response. Focus on the characteristics that matter to how you will use Gemini to perform your request.</p>
   ${artifact("Your Working Request",state.workingRequest)}
   <div class="actions"><button onclick="next(10)">Back</button><button class="primary" onclick="next(12)">Continue</button></div>`);
 }
 else if(screen===12){
  const revise = state.expectationDecision==="no";
  shell("Evaluate and Revise Expectations",`
   ${artifact("Your Working Request",state.workingRequest)}
   <p><strong>If Gemini completed this task successfully, what would you need from the response for it to actually be useful?</strong></p>
   <div class="example"><strong>Example:</strong><br>“Organize the report into Progress, Risks, and Decisions Needed. Keep it concise enough to review during the meeting.”</div>
   <button class="choice" onclick="expectationChoice('yes')"><strong>Yes — My request communicates what I need from the result</strong></button>
   <button class="choice" onclick="expectationChoice('no')"><strong>No — I want to clarify my expectations</strong></button>
   ${revise ? `
    <h2>Revise Your Working Request</h2>
    <p>Add or clarify the expectations that matter to how you will use the result.</p>
    <textarea id="workingExpectation">${esc(state.workingRequest)}</textarea>
    <p class="muted"><strong>Don't submit it to Gemini yet.</strong></p>
    <div class="actions"><button class="primary" onclick="saveExpectationRevision()">Save Revision and Continue</button></div>` : ``}
   <div class="actions"><button onclick="next(11)">Back</button></div>`);
 }
 else if(screen===13){
  shell("Review Your Revised Request",`
   <p>You have now considered three things that can help you provide clearer direction to Gemini:</p>
   <ul>
    <li><strong>Task</strong> — What do I want Gemini to do?</li>
    <li><strong>Context</strong> — What does Gemini need to know?</li>
    <li><strong>Expectations</strong> — What should a useful result look like?</li>
   </ul>
   ${artifact("Your Revised Request",state.workingRequest)}
   <p>Review your request as a whole. You may have changed one, several, or none of these elements. The goal isn't to create a perfect prompt or make it longer. The goal is to provide the direction that matters for your task.</p>
   <p><strong>Don't submit your revised request to Gemini yet.</strong></p>
   <p>Clear direction is only part of the interaction. Before asking Gemini to respond again, consider one more question:</p>
   <p class="lead"><strong>What information does Gemini need to perform the task?</strong></p>
   <div class="actions"><button onclick="next(12)">Back</button><button class="primary" onclick="next(14)">Continue</button></div>`);
 }
 else if(screen===14){
  shell("Give Gemini the Information It Needs",`
   <p>Giving AI clear direction is only part of the interaction. The AI also needs the right information to work with.</p>
   <p class="lead"><strong>What information would a knowledgeable person need to complete this task?</strong></p>
   <p>Does Gemini already have that information? If not, what information would you need to provide or make available?</p>
   <p>Depending on the task, this could be a document, notes, data, requirements, previous decisions, examples, or other information needed to complete the work.</p>
   <h2>Relevant Information Matters</h2>
   <p>More information does not necessarily produce a better result.</p>
   <p>Consider what is actually relevant to the task. Providing unnecessary, outdated, or unrelated information can make it harder for the AI to determine what matters.</p>
   ${artifact("Your Working Request",state.workingRequest)}
   <p>Next, consider what information Gemini would need to complete this request successfully.</p>
   <div class="actions"><button onclick="next(13)">Back</button><button class="primary" onclick="next(15)">Continue</button></div>`);
 }
 else if(screen===15){
  shell("Identify the Information Gemini Needs",`
   ${artifact("Your Working Request",state.workingRequest)}
   <p class="lead"><strong>What information does Gemini need to perform your task effectively?</strong></p>
   <p>Identify the information you would want Gemini to use. You do not need to provide the information itself yet.</p>
   <label for="informationNeeded"><strong>Information Gemini would need</strong></label>
   <textarea id="informationNeeded">${esc(state.informationNeeded)}</textarea>
   <p class="muted">Describe the information only. Do not paste, upload, or attach the actual source information here.</p>
   <div class="actions"><button onclick="next(14)">Back</button><button class="primary" onclick="saveInformationNeeded()">Continue</button></div>`);
 }
 else if(screen===16){
  shell("There Is More to Consider",`
   <p>Knowing what information Gemini needs is only part of the decision.</p>
   <h2>Technical consideration — Can Gemini access and use the information?</h2>
   <p>The answer depends on the capabilities of the AI and the environment in which you are using it. Different tools may allow you to provide or make information available in different ways.</p>
   <h2>Operational consideration — Should the information be used?</h2>
   <p>Consider whether the information is appropriate for the task, permitted for use with the AI, sufficiently current and reliable, and appropriate for the way the resulting work will be used.</p>
   <p>These considerations often happen at the same time. Information can be useful for a task but unavailable to the AI. It can be technically accessible but inappropriate to use. Or the AI may have access to information that is not the right source for the work.</p>
   <div class="actions"><button onclick="next(15)">Back</button><button class="primary" onclick="next(17)">Continue</button></div>`);
 }
 else if(screen===17){
  shell("Review the Information You Identified",`
   ${artifact("Your Working Request",state.workingRequest)}
   ${artifact("Information You Identified",state.informationNeeded)}
   <p>Now consider the information you identified.</p>
   <p><strong>Can Gemini access and use the information in your approved AI environment?</strong></p>
   <p><strong>Should the information be used for this task?</strong> Consider whether it is appropriate, permitted, sufficiently current and reliable, and suitable for the way the resulting work will be used.</p>
   <p>Use your judgment to determine what information, if any, you should provide or make available to Gemini when you continue.</p>
   <div class="actions"><button onclick="next(16)">Back</button><button class="primary" onclick="next(18)">Continue</button></div>`);
 }
 else if(screen===18){
  shell("Now Try Your Revised Request",`
   ${artifact("Your Revised Request",state.workingRequest)}
   ${artifact("Information You Identified",state.informationNeeded)}
   <p>You have now considered both the direction you are giving Gemini and the information it may need to perform the task.</p>
   <p>If the information you identified is appropriate and available in your approved AI environment, provide or make that information available as needed.</p>
   <p>Then switch to the <strong>same Gemini tab and conversation</strong> you have been using throughout this activity and submit your revised request.</p>
   <p>Review Gemini's new response. When you're ready, copy the <strong>relevant part of the work Gemini produced</strong>, return here, and paste it below.</p>
   <div class="example"><strong>For example:</strong> if Gemini drafted an email, capture the email body and, if useful, the subject line. You do not need to copy interface controls or connected-app elements that are not part of the work you asked Gemini to perform.</div>
   <label for="revisedResponse"><strong>Gemini's Revised Response</strong></label>
   <textarea id="revisedResponse">${esc(state.revisedResponse)}</textarea>
   <div class="actions"><button onclick="next(17)">Back</button><button class="primary" onclick="saveRevisedResponse()">Save Response and Continue</button></div>`);
 }
 else if(screen===19){
  shell("Is the Response Usable?",`
   ${artifact("Your Revised Request",state.workingRequest)}
   ${artifact("Gemini's Revised Response",state.revisedResponse)}
   <p>You have now given Gemini clearer direction and considered the information it needs to accomplish your task.</p>
   <p class="lead"><strong>Can this response accomplish the task or request you originally gave Gemini?</strong></p>
   <button class="choice" onclick="usabilityChoice('yes')"><strong>Yes — This response is usable for my original task</strong></button>
   <button class="choice" onclick="usabilityChoice('no')"><strong>No — This response does not yet accomplish my original task</strong></button>
   <div class="actions"><button onclick="next(18)">Back</button></div>`);
 }
 else if(screen===20){
  shell("Make a Purposeful Change",`
   ${artifact("Your Original Request",state.originalRequest)}
   ${artifact("Current Gemini Response",state.currentUsableResponse || state.revisedResponse)}
   <p>Before asking Gemini to try again, determine what prevented the response from accomplishing your task.</p>
   <p>You might consider:</p>
   <ul>
    <li>Was I clear about what I wanted Gemini to do?</li>
    <li>Did Gemini have the context it needed?</li>
    <li>Was I clear about what the result needed to accomplish?</li>
    <li>Did Gemini have the information it needed?</li>
    <li>Did Gemini assume or interpret something differently than I intended?</li>
   </ul>
   <p>Once you have identified what needs to change, capture the revision you want to make <strong>here first</strong>. This preserves the progression of your work before you return to Gemini.</p>
   <p>Your revision can be a complete revised request or a focused follow-up instruction, depending on what needs to change.</p>
   <label for="purposefulRevision"><strong>Your Purposeful Revision</strong></label>
   <textarea id="purposefulRevision">${esc(state.purposefulRevision)}</textarea>
   <p class="muted"><strong>Do not submit it to Gemini yet.</strong> Save it here first. On the next screen, you will take this revision back to the same Gemini conversation.</p>
   <div class="actions"><button class="primary" onclick="savePurposefulRevision()">Save Revision and Continue</button></div>`);
 }
 else if(screen===21){
  shell("Review the New Response",`
   ${artifact("Your Purposeful Revision",state.purposefulRevision)}
   <p>Copy the revision above, switch to the <strong>same Gemini conversation</strong>, and submit it.</p>
   <p>Review Gemini's new response, then copy the relevant part of that response and paste it below.</p>
   <label for="iterativeResponse"><strong>New Gemini Response</strong></label>
   <textarea id="iterativeResponse">${esc(state.iterativeResponse)}</textarea>
   <p class="lead"><strong>Can the new response accomplish your original task?</strong></p>
   <button class="choice" onclick="iterativeUsabilityChoice('yes')"><strong>Yes — This response is usable for my original task</strong></button>
   <button class="choice" onclick="iterativeUsabilityChoice('no')"><strong>No — It still does not accomplish my original task</strong></button>
   <div class="actions"><button onclick="next(20)">Back</button></div>`);
 }
 else if(screen===22){
  shell("Before You Rely on the Response",`
   ${artifact("Current Usable Gemini Response",state.currentUsableResponse)}
   <p>You have determined that the response can accomplish the task you originally gave Gemini. Before you rely on it, consider whether anything in the response needs to be verified.</p>
   <p class="lead"><strong>What, if anything, do I need to verify before I use this response?</strong></p>
   <p>Not every AI-assisted task requires the same level of verification. Consider what you are relying on and what could happen if the information were wrong.</p>
   <h2>Consider What You Are Relying On</h2>
   <ul>
    <li><strong>Does the response contain facts, claims, calculations, quotations, or other information I will rely on?</strong></li>
    <li><strong>Did Gemini introduce information that I did not provide?</strong></li>
    <li><strong>Does the work depend on a specific policy, requirement, procedure, source, or current information?</strong></li>
    <li><strong>What could happen if any of that information were wrong?</strong></li>
   </ul>
   <div class="actions"><button class="primary" onclick="next(23)">Continue</button></div>`);
 }
 else if(screen===23){
  const verifyMsg = state.verificationDecision==="verify"
    ? `<div class="warning"><strong>I still need to verify information.</strong><br>Verify the information you need to rely on using an appropriate source. Then return here and answer the verification question again.</div>`
    : ``;
  shell("Verify What Matters",`
   ${artifact("Current Usable Gemini Response",state.currentUsableResponse)}
   <p>If something matters to the task or the consequences of being wrong are significant, verify it against an appropriate source before relying on it.</p>
   <p>Gemini can help you examine its response, but its confidence—or another AI-generated answer—is not verification.</p>
   <h2>Iterate When Warranted</h2>
   <p>Verification may show that something needs to change. If it does, return to the part of the interaction that needs attention, make a purposeful revision, and try again when appropriate.</p>
   <p>The goal is not to keep prompting until you get a response you like. The goal is to iterate when it helps you accomplish the task appropriately.</p>
   <p class="lead"><strong>Have you verified the information you need to rely on in this Gemini response?</strong></p>
   <button class="choice" onclick="verificationChoice('yes')"><strong>Yes — I have verified what I need to rely on</strong></button>
   <button class="choice" onclick="verificationChoice('no')"><strong>No — I still need to verify or something needs to change</strong></button>
   ${state.verificationDecision==="no" ? `
     <h2>What do you need to do next?</h2>
     <button class="choice" onclick="verificationFollowup('verify')"><strong>I still need to verify information</strong></button>
     <button class="choice" onclick="verificationFollowup('revise')"><strong>Verification identified something that needs to change</strong></button>
   ` : ``}
   ${verifyMsg}
   <div class="actions"><button onclick="next(22)">Back</button></div>`);
 }
 else if(screen===24){
  if(state.completionMessage){
   shell("Activity Complete",`
    <div class="success"><strong>${esc(state.completionMessage)}</strong></div>
    <p>You may close this browser tab.</p>`);
  } else {
   shell("You Make the Professional Judgment",`
    ${artifact("Current Usable Gemini Response",state.currentUsableResponse)}
    <p>Gemini can support the work, but it does not decide whether the result is usable or appropriate for your purpose. <strong>You do.</strong></p>
    <p>You direct the AI, evaluate the result, verify what matters, and decide whether the AI-assisted work is appropriate to use.</p>
    <p class="lead"><strong>AI supports and expedites the work. You remain responsible for the professional judgment about the result.</strong></p>
    <div class="actions"><button class="primary" onclick="finishActivity()">Finish</button></div>`);
  }
 }
}
render();
</script>
</body>
</html>
